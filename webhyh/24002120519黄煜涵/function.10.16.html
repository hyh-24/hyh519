<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抓小球游戏|函数的三个方法的应用</title>
    <style>
        body {
            overflow: hidden;
            height: 100vh;
            background-color: #f0f0f0;
            font-size: 24px;
        }
        #info {
            padding: 10px;
            background:#222;
            color: #fff;
        }
        .ball {
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="info">当前分数：<span id="score">0</span></div>
    <div class="ball" id="ball"></div>
    <script>
        //const是常量指的是变量的引用地址不能变，不是对象里面的数据不能变
        const game={
            score:0,
           ballDom:document.getElementById('ball'),
           width:50,
           height:50
        };
        //需要说明函数：小球移动，点击，空白点击，更新分数
        function moveBall(){
            //保证小球在屏幕内
            const maxX=window.innerWidth-game.width;
            const maxY=window.innerHeight-game.height;
            //小球随机位置是0-窗口宽度取整
            const x=Math.floor(Math.random()*maxX);
            const y=Math.floor(Math.random()*maxY);
            //移动小球
            game.ballDom.style.left=x+'px';
            game.ballDom.style.top=y+'px';
        }
        //更新分数
        //普通的函数存在提升；函数体在后面，函数的调用在前面
        //有this，arguments；类数组对象，函数在调用时候传递过来的实参数字对象
        function updateScore(a,b){
            //a=arguments[0];
            // b=arguments[1];
            document.getElementById('score').innerText=game.score;
        }
        game.ballDom.addEventListener('click',function(e){
            //匿名函数有this->指向当前的dom元素（.ball）
            game.score+=2;
            updateScore();//函数调用
            moveBall();
            //阻止事件冒泡,避免触发body的miss扣分
            e.stopPropagation();
        });
        //点击空白区域扣分
        document.body.addEventListener('click',function(e){
            if(e.target !==game.ballDom){
                game.score-=1;
                console.log('点击的是；',game.score);
                updateScore();
            }
        });
        window.addEventListener("resize", function(){
        moveBall();
        });
        //扩展同时产生多个小球，但是不能交叉，小球定时随机换位置，所有小球全部点击才加分否则扣分
        </script>
</body>
</html>
