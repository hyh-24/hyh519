        return Promise.resolve(createResponse(mocks[key]));
      }
    }
    if (originalFetch) return originalFetch.apply(global, arguments);
    return Promise.reject(new Error('fetch not supported'));
  };

  Mock.mock = function (url, method, data) {
    if (typeof method === 'object') { data = method; }
    mocks[url] = data;
  };

  global.Mock = Mock;
})(window);
</script>

<script>
let huangBannerTimer = null;

/* ---------- 路由切换 ---------- */
function huangGo(page) {
  const app = document.getElementById('app');
  const tpl = document.getElementById('tpl-' + page);
  if (!tpl) return;

  if (huangBannerTimer) { clearInterval(huangBannerTimer); huangBannerTimer = null; }

  app.innerHTML = '';
  app.appendChild(tpl.content.cloneNode(true));

  const titles = {
    index:'首页', category:'分类', detail:'商品详情', publish:'发布闲置',
    message:'消息', profile:'我的', settings:'设置', admin:'后台管理'
  };
  document.title = '转转 - ' + (titles[page] || '') + ' | 24002120519 黄煜涵';

  switch (page) {
    case 'index':     huangInitIndex(); break;
    case 'category':  huangInitCategory(); break;
    case 'detail':    huangInitDetail(); break;
    case 'message':   huangInitMessage(); break;
    case 'admin':     huangInitAdmin(); break;
  }

  location.hash = page;
  window.scrollTo(0, 0);
}

/* ---------- 首页（fetch 接口 1：api/goods） ---------- */
function huangInitIndex() {
  huangInitBanner();
  huangRenderGoods();
  huangSearchFilter();
}

function huangInitBanner() {
  const wrap = document.getElementById('huangBannerWrap');
  const dots = document.querySelectorAll('#huangBannerDots span');
  if (!wrap || !dots.length) return;

  let index = 0;
  const total = wrap.children.length;

  function goTo(i) {
    index = i;
    wrap.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach((d, k) => d.classList.toggle('active', k === index));
  }

  huangBannerTimer = setInterval(() => goTo((index + 1) % total), 3000);

  let startX = 0;
  wrap.addEventListener('touchstart', e => startX = e.touches[0].clientX);
  wrap.addEventListener('touchend', e => {
    const diff = e.changedTouches[0].clientX - startX;
    if (diff > 50) goTo((index - 1 + total) % total);
    if (diff < -50) goTo((index + 1) % total);
  });
}

function huangRenderGoods() {
  const list = document.getElementById('huangGoodsList');
  if (!list) return;

  /* ---------- fetch 接口 1：首页商品列表 ---------- */
  fetch('api/goods')
    .then(res => res.json())
    .then(res => {
      list.innerHTML = res.data.map(item => `
        <a class="huang_goods_card" onclick="huangGo('detail')">
          <img src="${item.cover}" alt="${item.title}">
          <div class="huang_goods_info">
            <p class="huang_goods_title">${item.title}</p>
            <p class="huang_goods_price"><small>¥</small>${item.price}</p>
            <div class="huang_goods_meta">
              <span>${item.condition}</span>
              <span>${item.views}人浏览</span>
            </div>
          </div>
        </a>
      `).join('');
    });
}

function huangSearchFilter() {
  const input = document.getElementById('huangSearchInput');
  if (!input) return;

  input.addEventListener('input', e => {
    const kw = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.huang_goods_card').forEach(card => {
      const title = card.querySelector('.huang_goods_title').textContent.toLowerCase();
      card.style.display = title.includes(kw) ? '' : 'none';
    });
  });
}

/* ---------- 分类页（fetch 接口 2：api/category） ---------- */
function huangInitCategory() {
  const left = document.getElementById('huangCateLeft');
  const right = document.getElementById('huangCateRight');
  if (!left || !right) return;

  /* ---------- fetch 接口 2：分类数据 ---------- */
  fetch('api/category')
    .then(res => res.json())
    .then(res => {
      const list = res.data;

      left.innerHTML = list.map((item, i) =>
        `<div class="huang_cate_left_item ${i === 0 ? 'active' : ''}" data-index="${i}">${item.name}</div>`
      ).join('');

      function renderRight(index) {
        const cate = list[index];
        right.innerHTML = `
          <h3>${cate.name}</h3>
          <div class="huang_cate_grid">
            ${cate.children.map(c => `
              <div class="huang_cate_grid_item">
                <img src="${c.icon}" alt="${c.name}">
                <span>${c.name}</span>
              </div>
            `).join('')}
          </div>
        `;
      }
      renderRight(0);

      left.querySelectorAll('.huang_cate_left_item').forEach(el => {
        el.addEventListener('click', () => {
          left.querySelectorAll('.huang_cate_left_item').forEach(x => x.classList.remove('active'));
          el.classList.add('active');
          renderRight(Number(el.dataset.index));
        });
      });
    });
}

/* ---------- 详情页（fetch 接口 3：api/detail） ---------- */
function huangInitDetail() {
  const wrap = document.getElementById('huangDetailWrap');
  if (!wrap) return;

  /* ---------- fetch 接口 3：商品详情 ---------- */
  fetch('api/detail')
    .then(res => res.json())
    .then(res => {
      const d = res.data;
      wrap.innerHTML = `
        <img class="huang_detail_main" src="${d.images[0]}" alt="${d.title}">
        <div class="huang_detail_thumbs">
          ${d.images.map((img, i) => `
            <div class="huang_detail_thumb">
              <img src="${img}" class="${i === 0 ? 'active' : ''}" alt="图${i+1}">
            </div>
          `).join('')}
        </div>
        <div class="huang_detail_price_box">
          <div>
            <span class="huang_detail_price"><small>¥</small>${d.price}</span>
            <span class="huang_detail_original">¥${d.originalPrice}</span>
          </div>
          <p class="huang_detail_title">${d.title}</p>
          <div class="huang_detail_meta">
            <span>成色：${d.condition}</span>
            <span>${d.views}人浏览</span>
            <span>${d.publishTime}</span>
          </div>
        </div>
        <div class="huang_detail_seller">
          <img src="${d.seller.avatar}" alt="${d.seller.name}">
          <div class="huang_detail_seller_info">
            <p>${d.seller.name}</p>
            <span>信用分 ${d.seller.credit} · ${d.seller.fans}粉丝</span>
          </div>
          <div class="huang_detail_follow">关注</div>
        </div>
        <div class="huang_detail_desc">
          <h4>商品描述</h4>
          <p>${d.desc}</p>
        </div>
      `;

      const mainImg = document.querySelector('.huang_detail_main');
      const thumbs = document.querySelectorAll('.huang_detail_thumb img');
      thumbs.forEach(t => {
        t.addEventListener('click', () => {
          mainImg.src = t.src;
          thumbs.forEach(x => x.classList.remove('active'));
          t.classList.add('active');
        });
      });

      const btn = document.querySelector('.huang_collect_btn');
      if (btn) {
        btn.addEventListener('click', () => {
          btn.classList.toggle('active');
          btn.textContent = btn.classList.contains('active') ? '已收藏' : '收藏';
        });
      }
    });
}

/* ---------- 消息页（fetch 接口 4：api/messages） ---------- */
function huangInitMessage() {
  const list = document.getElementById('huangMsgList');
  if (!list) return;

  /* ---------- fetch 接口 4：消息列表 ---------- */
  fetch('api/messages')
    .then(res => res.json())
    .then(res => {
      list.innerHTML = res.data.map(m => `
        <div class="huang_msg_item">
          <img src="${m.avatar}" alt="${m.name}">
          <div class="huang_msg_info">
            <p>${m.name}</p>
            <span>${m.lastMsg}</span>
          </div>
          <div class="huang_msg_time">
            <div>${m.time}</div>
            ${m.unread > 0 ? `<div class="huang_msg_unread">${m.unread}</div>` : ''}
          </div>
        </div>
      `).join('');
    });
}

/* ---------- 后台管理（复用接口 1：api/goods） ---------- */
function huangInitAdmin() {
  const tbody = document.getElementById('huangAdminGoods');
  if (!tbody) return;

  fetch('api/goods')
    .then(res => res.json())
    .then(res => {
      const list = res.data;
      document.getElementById('huangGoodsCount').textContent = list.length;

      tbody.innerHTML = list.map(g => `
        <tr>
          <td>${g.id}</td>
          <td><img src="${g.cover}" alt="${g.title}"></td>
          <td>${g.title}</td>
          <td>¥${g.price}</td>
          <td>在售</td>
          <td>
            <button class="huang_admin_btn edit">编辑</button>
            <button class="huang_admin_btn del" onclick="alert('已下架：${g.title}')">下架</button>
          </td>
        </tr>
      `).join('');
    });

  const titleMap = {
    dashboard: '数据统计', users: '用户管理', goods: '商品管理',
    orders: '订单管理', category: '分类管理'
  };
  document.querySelectorAll('.huang_admin_menu_item').forEach(item => {
    item.onclick = () => {
      const tab = item.dataset.tab;
      document.querySelectorAll('.huang_admin_menu_item').forEach(x => x.classList.remove('active'));
      item.classList.add('active');
      document.querySelectorAll('.huang_admin_panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + tab).classList.add('active');
      document.getElementById('huangAdminTitle').textContent = titleMap[tab] || '';
    };
  });
}

/* ---------- 启动 ---------- */
window.addEventListener('DOMContentLoaded', () => {
  const hash = location.hash.replace('#', '') || 'index';
  if (document.getElementById('tpl-' + hash)) huangGo(hash);
  else huangGo('index');
});

window.addEventListener('hashchange', () => {
  const hash = location.hash.replace('#', '') || 'index';
  if (document.getElementById('tpl-' + hash)) huangGo(hash);
});
</script>
