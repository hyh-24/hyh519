<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 背景：冬日雪景 -->
  <defs>
    <linearGradient id="winterSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="50%" stop-color="#546e7a"/>
      <stop offset="100%" stop-color="#78909c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#winterSky)"/>
  <!-- 远山（雪） -->
  <path d="M0,250 L150,150 L300,220 L450,130 L600,200 L800,180 L800,400 L0,400 Z" fill="#eceff1"/>
  <path d="M0,300 L200,220 L400,270 L600,200 L800,250 L800,400 L0,400 Z" fill="#cfd8dc"/>
  <path d="M0,350 L250,280 L500,320 L750,270 L800,290 L800,400 L0,400 Z" fill="#b0bec5"/>
  <!-- 江面 -->
  <rect x="0" y="400" width="800" height="160" fill="#90a4ae"/>
  <rect x="0" y="400" width="800" height="160" fill="none" stroke="#78909c" stroke-width="1" stroke-dasharray="5,8"/>
  <!-- 雪花（飘落） -->
  <g fill="#fff" opacity="0.8">
    <circle cx="100" cy="80" r="2"/>
    <circle cx="200" cy="120" r="1.5"/>
    <circle cx="300" cy="60" r="2"/>
    <circle cx="400" cy="100" r="1.5"/>
    <circle cx="500" cy="50" r="2"/>
    <circle cx="600" cy="110" r="1.5"/>
    <circle cx="700" cy="90" r="2"/>
    <circle cx="150" cy="180" r="1.5"/>
    <circle cx="350" cy="200" r="2"/>
    <circle cx="550" cy="170" r="1.5"/>
    <circle cx="250" cy="300" r="1.5"/>
    <circle cx="450" cy="320" r="2"/>
    <circle cx="650" cy="290" r="1.5"/>
    <circle cx="80" cy="450" r="2"/>
    <circle cx="280" cy="480" r="1.5"/>
    <circle cx="480" cy="460" r="2"/>
    <circle cx="680" cy="490" r="1.5"/>
  </g>
  <!-- 一叶孤舟 -->
  <g transform="translate(380, 430)">
    <!-- 船身 -->
    <path d="M-50,0 Q-55,20 -40,25 L40,25 Q55,20 50,0 Q0,-10 -50,0" fill="#5d4037"/>
    <path d="M-40,0 L-45,15 L45,15 L40,0 Q0,-8 -40,0" fill="#6d4c41"/>
    <!-- 木桨 -->
    <line x1="30" y1="-5" x2="55" y2="15" stroke="#8d6e63" stroke-width="4"/>
    <ellipse cx="55" cy="15" rx="4" ry="10" fill="#8d6e63" transform="rotate(30 55 15)"/>
    <!-- 渔翁 -->
    <g transform="translate(0, -30)">
      <!-- 斗笠 -->
      <ellipse cx="0" cy="0" rx="22" ry="6" fill="#455a64"/>
      <ellipse cx="0" cy="-4" rx="12" ry="8" fill="#546e7a"/>
      <!-- 头 -->
      <circle cx="0" cy="3" r="7" fill="#d7ccc8"/>
      <!-- 蓑衣 -->
      <path d="M-12,10 Q-15,20 -10,30 L10,30 Q15,20 12,10 Q0,8 -12,10" fill="#37474f"/>
      <!-- 手（握钓竿） -->
      <line x1="8" y1="15" x2="18" y2="10" stroke="#37474f" stroke-width="4"/>
      <!-- 钓竿 -->
      <line x1="18" y1="10" x2="60" y2="-30" stroke="#5d4037" stroke-width="2.5"/>
      <!-- 鱼线 -->
      <line x1="60" y1="-30" x2="70" y2="30" stroke="#eceff1" stroke-width="1"/>
      <circle cx="70" cy="32" r="2" fill="#e53935"/>
    </g>
  </g>
  <!-- 岸边 -->
  <path d="M0,560 L100,540 L200,555 L300,535 L400,550 L500,530 L600,545 L700,535 L800,550 L800,600 L0,600 Z" fill="#fff"/>
  <!-- 枯树 -->
  <g stroke="#3e2723" stroke-width="3" fill="none">
    <path d="M150,560 L150,480"/>
    <path d="M150,510 L120,470"/>
    <path d="M150,500 L180,460"/>
    <path d="M150,490 L140,450"/>
    <path d="M150,480 L160,445"/>
  </g>
  <!-- 印章 -->
  <text x="700" y="580" font-family="serif" font-size="18" fill="#c0392b" opacity="0.6">江雪</text>
</svg>
