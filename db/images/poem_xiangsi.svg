<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 背景：春天 -->
  <defs>
    <linearGradient id="springBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e6c9"/>
      <stop offset="50%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
    <radialGradient id="sunlight" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fff9c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#springBg)"/>
  <rect width="800" height="600" fill="url(#sunlight)"/>
  <!-- 远山 -->
  <path d="M0,350 L200,280 L400,320 L600,270 L800,310 L800,600 L0,600 Z" fill="#66bb6a" opacity="0.5"/>
  <path d="M0,400 L250,340 L500,380 L750,330 L800,350 L800,600 L0,600 Z" fill="#4caf50" opacity="0.6"/>
  <!-- 红豆树（相思树） -->
  <g transform="translate(400, 180)">
    <!-- 树干 -->
    <path d="M0,280 Q-10,200 0,120 Q5,60 20,20 Q25,80 20,150 Q15,220 30,280" fill="#5d4037"/>
    <path d="M10,120 Q-40,90 -60,70" stroke="#5d4037" stroke-width="5" fill="none"/>
    <path d="M15,180 Q60,160 90,140" stroke="#5d4037" stroke-width="4" fill="none"/>
    <!-- 树叶 -->
    <ellipse cx="-60" cy="60" rx="55" ry="45" fill="#2e7d32"/>
    <ellipse cx="-30" cy="30" rx="50" ry="40" fill="#388e3c"/>
    <ellipse cx="20" cy="10" rx="55" ry="45" fill="#2e7d32"/>
    <ellipse cx="60" cy="40" rx="50" ry="40" fill="#388e3c"/>
    <ellipse cx="100" cy="80" rx="45" ry="35" fill="#2e7d32"/>
    <ellipse cx="0" cy="80" rx="40" ry="35" fill="#43a047"/>
    <!-- 红豆（散落点缀） -->
    <g fill="#c62828">
      <circle cx="-60" cy="85" r="5"/>
      <circle cx="-45" cy="100" r="4"/>
      <circle cx="-30" cy="90" r="5"/>
      <circle cx="10" cy="60" r="4"/>
      <circle cx="30" cy="80" r="5"/>
      <circle cx="55" cy="55" r="4"/>
      <circle cx="70" cy="75" r="5"/>
      <circle cx="90" cy="100" r="4"/>
      <circle cx="15" cy="40" r="4"/>
      <circle cx="-15" cy="55" r="5"/>
    </g>
    <g fill="#e53935">
      <circle cx="-55" cy="110" r="3"/>
      <circle cx="25" cy="30" r="3"/>
      <circle cx="80" cy="110" r="3"/>
      <circle cx="-10" cy="105" r="3"/>
      <circle cx="45" cy="95" r="3"/>
    </g>
  </g>
  <!-- 飘落的红豆 -->
  <g fill="#c62828">
    <circle cx="150" cy="200" r="5"/>
    <circle cx="180" cy="260" r="4"/>
    <circle cx="220" cy="320" r="5"/>
    <circle cx="650" cy="180" r="5"/>
    <circle cx="700" cy="250" r="4"/>
    <circle cx="720" cy="310" r="5"/>
    <circle cx="350" cy="400" r="4"/>
    <circle cx="500" cy="420" r="5"/>
  </g>
  <!-- 草地 -->
  <rect x="0" y="480" width="800" height="120" fill="#388e3c"/>
  <!-- 小草 -->
  <g stroke="#1b5e20" stroke-width="2" fill="none">
    <path d="M50,520 Q52,500 55,490"/>
    <path d="M120,530 Q123,510 126,500"/>
    <path d="M200,525 Q202,505 205,495"/>
    <path d="M600,520 Q603,500 606,490"/>
    <path d="M680,530 Q682,510 685,500"/>
    <path d="M750,525 Q753,505 756,495"/>
  </g>
  <!-- 印章 -->
  <text x="700" y="560" font-family="serif" font-size="18" fill="#c0392b" opacity="0.6">相思</text>
</svg>
