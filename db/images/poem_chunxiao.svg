<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 背景：春天早晨 -->
  <defs>
    <linearGradient id="springSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="50%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#55efc4" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="60%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#springSky)"/>
  <!-- 太阳 -->
  <circle cx="680" cy="120" r="100" fill="url(#sunGlow)"/>
  <circle cx="680" cy="120" r="50" fill="#ffd54f"/>
  <!-- 远山 -->
  <path d="M0,450 L200,350 L350,400 L500,320 L650,380 L800,350 L800,600 L0,600 Z" fill="#81c784" opacity="0.6"/>
  <path d="M0,500 L250,420 L500,460 L700,410 L800,440 L800,600 L0,600 Z" fill="#4caf50" opacity="0.7"/>
  <!-- 草地 -->
  <rect x="0" y="520" width="800" height="80" fill="#66bb6a"/>
  <!-- 主树（花树） -->
  <g transform="translate(100, 280)">
    <!-- 树干 -->
    <path d="M0,240 Q-5,150 0,60 Q5,30 15,0 Q20,60 15,120 Q10,180 20,240" fill="#5d4037"/>
    <!-- 分支 -->
    <path d="M10,100 Q-40,70 -60,50" stroke="#5d4037" stroke-width="4" fill="none"/>
    <path d="M10,140 Q50,120 80,100" stroke="#5d4037" stroke-width="3" fill="none"/>
    <!-- 树冠/花朵簇 -->
    <circle cx="-60" cy="40" r="50" fill="#ffb7c5"/>
    <circle cx="-40" cy="60" r="40" fill="#ffc8dd"/>
    <circle cx="0" cy="20" r="55" fill="#ffafcc"/>
    <circle cx="40" cy="40" r="45" fill="#ffc8dd"/>
    <circle cx="80" cy="70" r="40" fill="#ffb7c5"/>
    <circle cx="20" cy="70" r="50" fill="#ffafcc"/>
    <!-- 散落的花 -->
    <circle cx="-10" cy="100" r="5" fill="#ff69b4"/>
    <circle cx="30" cy="110" r="4" fill="#ff69b4"/>
    <circle cx="-50" cy="80" r="4" fill="#ff1493"/>
  </g>
  <!-- 第二棵小树 -->
  <g transform="translate(600, 360)">
    <rect x="0" y="0" width="8" height="160" fill="#5d4037"/>
    <circle cx="4" cy="-20" r="40" fill="#a8e6cf"/>
    <circle cx="-20" cy="0" r="30" fill="#88d8b0"/>
    <circle cx="30" cy="10" r="35" fill="#a8e6cf"/>
  </g>
  <!-- 花朵装饰 -->
  <g fill="#ff69b4">
    <circle cx="300" cy="540" r="5"/>
    <circle cx="350" cy="550" r="4"/>
    <circle cx="420" cy="545" r="6"/>
    <circle cx="500" cy="555" r="4"/>
    <circle cx="560" cy="540" r="5"/>
  </g>
  <g fill="#ffd700">
    <circle cx="320" cy="555" r="3"/>
    <circle cx="440" cy="555" r="3"/>
    <circle cx="520" cy="560" r="3"/>
  </g>
  <!-- 小鸟剪影（树枝上的鸟） -->
  <g fill="#2c3e50" transform="translate(200, 320)">
    <ellipse cx="0" cy="0" rx="15" ry="8"/>
    <circle cx="10" cy="-5" r="6"/>
    <path d="M15,-5 L25,-3 L15,-2 Z" fill="#f39c12"/>
    <rect x="8" y="-12" width="2" height="4" fill="#2c3e50"/>
    <!-- 翅膀 -->
    <path d="M-5,-2 Q-15,-15 -25,-5 Q-15,0 -5,-2" fill="#34495e"/>
  </g>
  <!-- 另一只小鸟 -->
  <g fill="#2c3e50" transform="translate(550, 280)">
    <ellipse cx="0" cy="0" rx="12" ry="6"/>
    <circle cx="8" cy="-4" r="5"/>
    <path d="M12,-4 L20,-2 L12,-1 Z" fill="#f39c12"/>
    <path d="M-4,-1 Q-12,-12 -20,-5 Q-12,0 -4,-1" fill="#34495e"/>
  </g>
  <!-- 飘动的花瓣 -->
  <g fill="#ffb7c5" opacity="0.7">
    <circle cx="200" cy="200" r="3"/>
    <circle cx="400" cy="180" r="2"/>
    <circle cx="350" cy="250" r="3"/>
    <circle cx="500" cy="220" r="2"/>
    <circle cx="150" cy="150" r="2"/>
  </g>
  <!-- 印章 -->
  <text x="700" y="560" font-family="serif" font-size="18" fill="#c0392b" opacity="0.6">春晓</text>
</svg>
