<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bottom Nav · Lucide SVG</title>
    <style>
        /* ===== hyh 变量 ===== */
        :root {
            --hyh_mobile_max: 440px;
            --hyh_nav_h: 64px;
            --hyh_bg: #0f1115;
            --hyh_surface: #1a1d24;
            --hyh_surface-2: #23262e;
            --hyh_nav_bg: rgba(26, 29, 36, 0.85);
            --hyh_active: #00d4aa;
            --hyh_active-soft: rgba(0, 212, 170, 0.15);
            --hyh_inactive: #5c6070;
            --hyh_text: #f0f2f5;
            --hyh_text-soft: #b0b3c0;
            --hyh_badge: #ff3366;
            --hyh_red_dot: #ff4757;
            --hyh_border: rgba(255, 255, 255, 0.06);
            --hyh_safe_bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
            background: #000;
            color: var(--hyh_text);
        }

        /* ===== 手机容器 ===== */
        .hyh_phone_frame {
            max-width: var(--hyh_mobile_max);
            margin: 0 auto;
            min-height: 100vh;
            background: var(--hyh_bg);
            position: relative;
            overflow: hidden;
        }

        /* ===== 首页入口 ===== */
        .hyh_home_link {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 200;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--hyh_text-soft);
            text-decoration: none;
            padding: 8px 14px;
            border: 1px solid var(--hyh_border);
            border-radius: 20px;
            background: rgba(26, 29, 36, 0.8);
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }
        .hyh_home_link:active { background: var(--hyh_active); color: var(--hyh_bg); border-color: var(--hyh_active); }

        /* ===== 顶部 Header ===== */
        .hyh_top_header {
            padding: 52px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .hyh_header_title {
            font-family: system-ui, sans-serif;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .hyh_header_title span { color: var(--hyh_active); }
        .hyh_header_counter {
            font-size: 11px;
            color: var(--hyh_text-soft);
            letter-spacing: 0.1em;
            text-align: right;
        }
        .hyh_header_counter strong {
            display: block;
            font-size: 20px;
            color: var(--hyh_active);
            font-weight: 700;
            letter-spacing: 0;
            margin-bottom: 2px;
            font-family: system-ui, sans-serif;
        }

        /* ===== 页面内容 ===== */
        .hyh_page_content {
            padding: 0 16px calc(var(--hyh_nav_h) + var(--hyh_safe_bottom) + 32px);
        }

        .hyh_stat_grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .hyh_stat_card {
            background: var(--hyh_surface);
            border: 1px solid var(--hyh_border);
            border-radius: 12px;
            padding: 16px;
        }
        .hyh_stat_label {
            font-size: 10px;
            color: var(--hyh_inactive);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .hyh_stat_value {
            font-family: system-ui, sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--hyh_active);
        }
        .hyh_stat_delta {
            font-size: 11px;
            color: #00c896;
            margin-top: 4px;
            font-family: system-ui, sans-serif;
        }

        .hyh_activity_list {
            background: var(--hyh_surface);
            border: 1px solid var(--hyh_border);
            border-radius: 12px;
            overflow: hidden;
        }
        .hyh_activity_item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--hyh_border);
            font-family: system-ui, sans-serif;
        }
        .hyh_activity_item:last-child { border-bottom: none; }
        .hyh_activity_avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--hyh_surface-2);
            display: flex; align-items: center; justify-content: center;
            color: var(--hyh_active);
        }
        .hyh_activity_avatar svg { width: 18px; height: 18px; }
        .hyh_activity_body { flex: 1; }
        .hyh_activity_name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
        .hyh_activity_desc { font-size: 12px; color: var(--hyh_inactive); }
        .hyh_activity_time { font-size: 10px; color: var(--hyh_inactive); letter-spacing: 0.05em; }

        /* ===== 底部导航（胶囊浮动式） ===== */
        .hyh_bottom_nav {
            position: fixed;
            bottom: calc(16px + var(--hyh_safe_bottom));
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: calc(var(--hyh_mobile_max) - 32px);
            height: var(--hyh_nav_h);
            background: var(--hyh_nav_bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--hyh_border);
            border-radius: 24px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px;
            z-index: 150;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .hyh_nav_item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            position: relative;
            cursor: pointer;
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        /* active 背景 pill */
        .hyh_nav_item.is_active {
            background: var(--hyh_active-soft);
        }

        .hyh_nav_icon_wrap {
            position: relative;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hyh_nav_icon_wrap svg {
            width: 24px;
            height: 24px;
            stroke: var(--hyh_inactive);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hyh_nav_label {
            font-size: 9px;
            font-weight: 500;
            color: var(--hyh_inactive);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.3s;
            font-family: system-ui, sans-serif;
        }

        /* ===== Active 态 ===== */
        .hyh_nav_item.is_active .hyh_nav_icon_wrap svg {
            stroke: var(--hyh_active);
            transform: translateY(-1px);
        }
        .hyh_nav_item.is_active .hyh_nav_label {
            color: var(--hyh_active);
            font-weight: 700;
        }

        /* ===== 数字徽章 ===== */
        .hyh_nav_badge {
            position: absolute;
            top: -2px;
            right: -12px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            background: var(--hyh_badge);
            color: white;
            font-size: 10px;
            font-weight: 700;
            line-height: 18px;
            text-align: center;
            font-family: system-ui, sans-serif;
            box-shadow: 0 0 0 2px var(--hyh_bg);
            animation: hyh_badge-bounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ===== 小红点 ===== */
        .hyh_nav_dot {
            position: absolute;
            top: 1px;
            right: -1px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--hyh_red_dot);
            box-shadow: 0 0 0 2px var(--hyh_bg);
            animation: hyh_dot-breath 2s ease-in-out infinite;
        }

        @keyframes hyh_badge-bounce {
            0% { transform: scale(0); }
            60% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
        @keyframes hyh_dot-breath {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.6); }
            50% { opacity: 0.8; transform: scale(0.85); box-shadow: 0 0 0 4px rgba(255, 71, 87, 0); }
        }

        /* ===== 点击 ripple ===== */
        .hyh_nav_item:active { transform: scale(0.92); }
    </style>
</head>
<body>

    <div class="hyh_phone_frame">

        <!-- 首页入口 -->
        <a href="index.html" class="hyh_home_link">← home</a>

        <!-- 顶部 Header -->
        <header class="hyh_top_header">
            <h1 class="hyh_header_title">Good <span>evening</span>.</h1>
            <div class="hyh_header_counter">
                <strong id="hyh_counter_num">24</strong>
                items / today
            </div>
        </header>

        <!-- 页面主内容 -->
        <div class="hyh_page_content">

            <!-- 统计卡片 -->
            <div class="hyh_stat_grid">
                <div class="hyh_stat_card">
                    <div class="hyh_stat_label">ACTIVE</div>
                    <div class="hyh_stat_value">128</div>
                    <div class="hyh_stat_delta">↑ 12% this week</div>
                </div>
                <div class="hyh_stat_card">
                    <div class="hyh_stat_label">SAVED</div>
                    <div class="hyh_stat_value">2.4k</div>
                    <div class="hyh_stat_delta">↑ 8%</div>
                </div>
            </div>

            <!-- 活动列表 -->
            <div class="hyh_activity_list">
                <div class="hyh_activity_item">
                    <div class="hyh_activity_avatar"><i data-lucide="zap"></i></div>
                    <div class="hyh_activity_body">
                        <div class="hyh_activity_name">System Update Complete</div>
                        <div class="hyh_activity_desc">v2.4.0 deployed successfully</div>
                    </div>
                    <span class="hyh_activity_time">2m</span>
                </div>
                <div class="hyh_activity_item">
                    <div class="hyh_activity_avatar"><i data-lucide="user-plus"></i></div>
                    <div class="hyh_activity_body">
                        <div class="hyh_activity_name">New Member Joined</div>
                        <div class="hyh_activity_desc">alex@studio.dev accepted invite</div>
                    </div>
                    <span class="hyh_activity_time">1h</span>
                </div>
                <div class="hyh_activity_item">
                    <div class="hyh_activity_avatar"><i data-lucide="shield-check"></i></div>
                    <div class="hyh_activity_body">
                        <div class="hyh_activity_name">Backup Verified</div>
                        <div class="hyh_activity_desc">Daily snapshot confirmed healthy</div>
                    </div>
                    <span class="hyh_activity_time">3h</span>
                </div>
            </div>

        </div>

        <!-- 胶囊式固定底部导航 -->
        <nav class="hyh_bottom_nav">

            <!-- 1. Dashboard（红点） -->
            <div class="hyh_nav_item is_active" data-tab="dashboard">
                <div class="hyh_nav_icon_wrap">
                    <i data-lucide="layout-dashboard"></i>
                    <span class="hyh_nav_dot"></span>
                </div>
                <span class="hyh_nav_label">Dash</span>
            </div>

            <!-- 2. Explore（数字徽章 5） -->
            <div class="hyh_nav_item" data-tab="explore">
                <div class="hyh_nav_icon_wrap">
                    <i data-lucide="compass"></i>
                    <span class="hyh_nav_badge">5</span>
                </div>
                <span class="hyh_nav_label">Explore</span>
            </div>

            <!-- 3. Inbox（数字徽章 99+） -->
            <div class="hyh_nav_item" data-tab="inbox">
                <div class="hyh_nav_icon_wrap">
                    <i data-lucide="mail"></i>
                    <span class="hyh_nav_badge">99+</span>
                </div>
                <span class="hyh_nav_label">Inbox</span>
            </div>

            <!-- 4. Settings -->
            <div class="hyh_nav_item" data-tab="settings">
                <div class="hyh_nav_icon_wrap">
                    <i data-lucide="settings"></i>
                </div>
                <span class="hyh_nav_label">Gear</span>
            </div>

        </nav>

    </div>

    <!-- Lucide UMD -->
    <script src="cdn/lucide/lucide.min.js"></script>
    <script>
        // hyh_ 命名：初始化 Lucide + 导航切换
        const hyh_initNav = () => {
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons({ nameAttr: 'data-lucide' });
            }

            const hyh_navItems = document.querySelectorAll('.hyh_nav_item');
            const hyh_counterNum = document.getElementById('hyh_counter_num');

            const hyh_tabData = {
                dashboard: { num: 24 },
                explore:   { num: 18 },
                inbox:     { num: 7 },
                settings:  { num: 0 }
            };

            hyh_navItems.forEach(item => {
                item.addEventListener('click', () => {
                    hyh_navItems.forEach(n => n.classList.remove('is_active'));
                    item.classList.add('is_active');
                    const key = item.dataset.tab;
                    if (hyh_tabData[key] && hyh_counterNum) {
                        hyh_counterNum.textContent = hyh_tabData[key].num;
                    }
                });
            });
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', hyh_initNav);
        } else {
            hyh_initNav();
        }
    </script>
</body>
</html>
